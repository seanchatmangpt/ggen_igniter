[package]
name = "ggen_graph_nif"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ggen_graph_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36"
# Pinned to the same oxigraph minor as ~/ggen's workspace (`Cargo.toml`
# `[workspace.dependencies] oxigraph = { version = "0.5.11", ... }`). See
# DRIFT.md in this directory for the graphlaw/oxigraph divergence ledger.
oxigraph = { version = "0.5.11", features = ["rdf-12"] }
