[package]
name = "ggen_graph_nif"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ggen_graph_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36"
# Exact pin matching ~/ggen/Cargo.lock's oxigraph 0.5.11 (workspace dep
# declares "0.5.11"; lock resolves 0.5.11). See DRIFT.md.
oxigraph = { version = "=0.5.11", features = ["rdf-12"] }
