# docker-compose.e2e.yml — one-liner entry point for the Docker downstream-consumer
# validation test. See docs/reference/docker-e2e.md.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml run --rm e2e
#
# Requires network access (real `mix archive.install`/`mix igniter.new`/`mix deps.get`
# Hex+GitHub fetches — no offline mode exists) and takes several minutes, same as the
# bare `mix e2e` this wraps.
services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    volumes:
      - .:/Users/sac/ggen_igniter
      # deps/_build get their own named volumes, separate from the host tree:
      # the host's own compiled BEAM/NIF artifacts are built for the host's
      # Elixir/OTP/arch and are not ABI-compatible with the container's — bind-
      # mounting them in caused a real `:beam_lib`/`binary_to_atom` crash while
      # compiling the `:rdf` dep (a stale host-compiled .beam file read inside
      # the container). Named volumes let the container compile its own tree.
      - ggen_igniter_e2e_deps:/Users/sac/ggen_igniter/deps
      - ggen_igniter_e2e_build:/Users/sac/ggen_igniter/_build
    working_dir: /Users/sac/ggen_igniter
    command: ["sh", "-c", "mix deps.get && mix e2e"]

  # Real Postgres for the Chicago data-layer tests (`@moduletag :postgres`; see
  # test/support/postgres_case.ex and docs/contributing/chicago-pack-testing.md).
  # Opt-in: `docker compose -f docker-compose.e2e.yml --profile db up -d postgres`, then
  # `QUALIFY_PGHOST=localhost QUALIFY_PGPORT=5432 QUALIFY_PGUSER=postgres QUALIFY_PGPASSWORD=postgres mix test --include integration --only postgres`.
  postgres:
    image: postgres:15
    profiles: ["db"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ggen_igniter_e2e_deps:
  ggen_igniter_e2e_build:
