[[mutant]]
id = "M14-prose-admits-every-stamp"
file = "lib/ggen_igniter/semantic_jira/prose.ex"
test = "test/ggen_igniter_semantic_jira_origin_guard_test.exs"
description = "admit_goal reports every stamped authority as admitted (prose admits)"
search = '''
        {admitted, not_pinned} = pin_verdict(stamped_map(report))'''
replace = '''
        {admitted, not_pinned} = {stamped_map(report) |> Map.keys() |> Enum.sort(), []}'''

[[mutant]]
id = "M15-pins-accept-ambiguous"
file = "lib/ggen_igniter/semantic_jira/authority.ex"
test = "test/ggen_igniter_semantic_jira_origin_guard_test.exs"
description = "pins/1 keeps an IRI pinned to two different digests"
search = '''
        [digest] -> [{iri, digest}]
        _ambiguous -> []'''
replace = '''
        [digest | _] -> [{iri, digest}]
        _ambiguous -> []'''
