# G1 origin-guard mutation catalog (v26.9.25 post-tag hardening).
# scripts/sjira/origin_mutants.sh applies each mutant to a FRESH `git archive`
# extraction of the subject, runs `test`, and requires it to FAIL (killed).
# `search` must occur exactly once in `file`; otherwise the mutant is
# REFUSED(MUTANT_NOT_APPLICABLE) and the court fails (never skipped).
# Literal strings (''') carry the exact bytes; no escapes are processed.

[[mutant]]
id = "M01-lease-request-guard"
file = "lib/ggen_igniter/semantic_jira.ex"
test = "test/ggen_igniter_semantic_jira_origin_guard_test.exs"
description = "lease_request/3 skips the origin guard"
search = '''
  def lease_request(work_order, attrs, opts \\ []) when is_map(attrs) do
    attrs = strings(attrs)

    with {:ok, admitted} <- admit_work_order(work_order),
         {:ok, _origin_digest} <- Authority.require_origin(admitted, opts),'''
replace = '''
  def lease_request(work_order, attrs, opts \\ []) when is_map(attrs) do
    attrs = strings(attrs)

    with {:ok, admitted} <- admit_work_order(work_order),
         {:ok, _origin_digest} <- {:ok, :mutant_bypass},'''

