[[mutant]]
id = "M04-promote-guard-and-none-bypass"
file = "lib/ggen_igniter/semantic_jira.ex"
test = "test/ggen_igniter_semantic_jira_origin_guard_test.exs"
description = "promote/4 skips the origin guard and restores the NONE bypass (any digest-shaped origin passes)"
search = '''
         {:ok, origin_digest} <- promotion_origin(admitted, opts) do'''
replace = '''
         origin_digest = "sha256:" <> String.duplicate("0", 64) do'''

