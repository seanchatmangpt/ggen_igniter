[[mutant]]
id = "M09-index-from-unpinned"
file = "lib/ggen_igniter/semantic_jira/authority.ex"
test = "test/ggen_igniter_semantic_jira_origin_guard_test.exs"
description = "index_from/1 returns the unpinned index (caller self-stamps admitted)"
search = '''
      {:ok, pin(unpinned, pins)}'''
replace = '''
      {:ok, unpinned}'''

[[mutant]]
id = "M10-pin-ignores-digest"
file = "lib/ggen_igniter/semantic_jira/authority.ex"
test = "test/ggen_igniter_semantic_jira_origin_guard_test.exs"
description = "pin/2 keeps any pinned IRI whatever its digest (forged digest admitted)"
search = '''
        is_binary(iri) and is_binary(digest) and Map.get(pins, iri) == digest'''
replace = '''
        is_binary(iri) and is_binary(digest) and Map.has_key?(pins, iri)'''

