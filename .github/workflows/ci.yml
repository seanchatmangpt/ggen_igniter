name: ggen_igniter CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    name: Elixir tests (mix credo + mix test)

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Full history, NOT the default depth-1 fetch: the semantic-jira
          # pack's opt-in git ground truth tests (test/ggen_igniter_semantic_
          # jira_pack_test.exs, "opt-in git ground truth for baseSha") drive
          # the REAL CLI whose `--verify-cwd` default is `File.cwd!()` -- this
          # checkout -- and verify the canonical graph's baseSha
          # d84da1419a6945c6a8a64b8f6cdca9d0b2c9e0f3 (main's tip, 3 commits
          # behind this branch's head) as a real ancestor of HEAD via
          # `git cat-file -e <sha>^{commit}` + `git merge-base --is-ancestor
          # <sha> HEAD`. A depth-1 fetch only materializes the head commit's
          # objects, so BOTH commands exit 128 there and the honest-pass side
          # refuses with `REFUSED:SEMANTIC_JIRA_BASE_SHA_UNVERIFIED` -- the
          # exact 3/1051 failures in run 35504307039 (2026-09-20; the 3
          # siblings that need no real-ancestor reachability passed). Same
          # root cause class as the ex4pm fixture step below: shallow clones
          # break real-git-history tests, so do not "optimize" this back to
          # depth 1. `forbid-generated-output-dir-once.yml` already uses
          # fetch-depth: 0 for the same reason.
          fetch-depth: 0

      # Real fixture checkout: 10 real ExUnit test files
      # (test/ggen_igniter_base_*_test.exs, test/ggen_igniter_install_task_
      # test.exs -- see `grep -rl Ex4pmFixture test/`) read real source
      # bytes off `test/support/ex4pm_fixture.ex`'s `@ex4pm_root`, which is
      # `Path.join(System.user_home!(), "ex4pm")` i.e. `$HOME/ex4pm` on the
      # runner. That module's own moduledoc documents `~/ex4pm` as already
      # present on real dev machines, but a hosted GitHub Actions runner has
      # no such checkout, so every one of those tests previously failed with
      # `** (File.Error) could not git show 725f495^:mix.exs (exit 2):
      # "/home/runner/ex4pm/mix.exs": no such file or directory` --
      # confirmed as ~30 of 35 hosted `mix test` failures, pre-existing on
      # main at 6b9baecf (not introduced by this branch).
      #
      # `actions/checkout` is NOT used here: its `path:` input is scoped
      # under `$GITHUB_WORKSPACE`, but `Ex4pmFixture` needs the real,
      # unscoped `$HOME/ex4pm` path. A plain `git clone` lands it exactly
      # where the fixture module expects.
      #
      # Full clone, NOT `--depth=1`: `Ex4pmFixture.read_pinned!/1` runs
      # `git show 725f495^:<path>` (see ex4pm_fixture.ex), which needs real
      # commit history reachable back through `725f495^`. A shallow clone
      # would only fetch the tip commit's tree and make that `git show`
      # fail with the exact same "no such file or directory"-shaped error
      # this step exists to fix -- so do not "optimize" this into
      # `--depth=1` even though ex4pm is otherwise only read via `File.
      # read!/1` (which doesn't need history) for most fixture files; the
      # pinned reads are real and need the full clone.
      - name: Clone ex4pm fixture repo (full history, not shallow -- see comment)
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/seanchatmangpt/ex4pm.git "$HOME/ex4pm"
          git -C "$HOME/ex4pm" cat-file -e 725f495^ && \
            echo "confirmed: 725f495^ reachable in $HOME/ex4pm history"

      # Real ggen binary on PATH: several real, non-mocked ExUnit tests
      # (test/ggen_igniter_fortune5_ready_task_test.exs,
      # test/ggen_igniter_sync_shellout_test.exs) shell out to the real
      # `ggen` CLI and are gated behind `if System.find_executable("ggen")`
      # -- a named, visible skip when absent, per this repo's Chicago-style
      # testing discipline (real collaborator over a mock). Installing the
      # same pinned release this repo's own docs cite
      # (docs/jira/v26.9.1/PARITY-VALIDATION.md: "ggen --version -> ggen
      # 26.8.28") makes those tests actually run in CI instead of skip.
      # Checksum independently reverified against this exact release asset
      # during CI-07 authoring, not copied blind from beam4pm's workflow.
      - name: Install ggen (pinned release, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          archive="$RUNNER_TEMP/ggen-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --tlsv1.2 \
            -o "$archive" \
            https://github.com/seanchatmangpt/ggen/releases/download/v26.8.28/ggen-x86_64-unknown-linux-gnu.tar.gz
          echo 'ccb9fe78ef0c84d8b240b45beb6e73f47e2c930d5db3efcf9a0e58dfe071d313  '"$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.local/bin" ggen
          chmod +x "$HOME/.local/bin/ggen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Erlang/OTP + Elixir + rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          # Pinned to this repo's own .tool-versions (elixir 1.18.4-otp-27,
          # erlang 27.2.4) -- NOT beam4pm's pins, which are a different repo.
          elixir-version: '1.18.4'
          otp-version: '27.2.4'
          rebar3-version: '3.24.0'

      - name: Cache mix dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          restore-keys: "${{ runner.os }}-mix-27.2.4-1.18.4-\n${{ runner.os }}-mix-27.2.4-\n${{ runner.os }}-mix-\n"
          # Key carries the crate's Cargo.lock hash too: it rotates whenever
          # the NIF's rust dependencies change, so the cached cargo target
          # dir below is saved/re-saved at the right times instead of going
          # permanently stale under a mix.lock-only key.
          key: ${{ runner.os }}-mix-27.2.4-1.18.4-${{ hashFiles('mix.lock') }}-${{ hashFiles('native/ggen_graph_nif/Cargo.lock') }}
          path: "deps\n~/.hex\n~/.mix\n_build\nnative/ggen_graph_nif/target\n"

      - name: mix deps.get
        shell: bash
        run: |
          mix deps.get

      # The `_build` cache is an immutable per-key actions/cache snapshot:
      # since the run that first saved the current `mix.lock`-keyed snapshot
      # (the only green run, 35021796291 on 2026-09-15 -- a cache MISS that
      # built everything for real), every later run restores that same
      # `_build`. Mix then marks `GgenIgniter.Native.GraphNif` (the rustler
      # loader module) up-to-date whenever neither `graph_nif.ex` nor its
      # `@external_resource` crate sources changed -- so rustler never runs,
      # `ggen_graph_nif` is never compiled, and
      # `_build/<env>/lib/ggen_igniter/priv/native/ggen_graph_nif.so` is
      # missing. Every NIF-backed test then fails with "function
      # GgenIgniter.Native.GraphNif.query_turtle/2 is undefined (module ...
      # is not available)": the 9 oxigraph/ASK-CONSTRUCT failures on every
      # run since 2026-09-18, pre-existing on main (35315548332), NOT
      # introduced by any branch's commits. Verified 2026-09-20: in the
      # failing runs, ggen_igniter DOES recompile its changed modules
      # ("Compiling 4 files (.ex)" + "Generated ggen_igniter app") with no
      # "Compiling crate ggen_graph_nif" line anywhere, and the repo's own
      # `ggen_igniter.doctor --json` reports `nif_compiles: ok` (real cargo
      # build) next to `oxigraph_smoke_test: error` (NIF absent) in the same
      # JSON document. Deleting ONLY this app's build artifacts (deps' beams
      # stay cached) forces a real ggen_igniter + NIF rebuild on every run --
      # the state a fresh checkout gets. The cargo target dir is cached (see
      # key above), so the forced rustler pass is incremental in steady
      # state. Locally reproduced and verified: with the app dirs wiped,
      # `mix compile` + `mix test test/*oxigraph*` rebuild the crate and go
      # 24/0 green; without the wipe, a deleted .so is never restored
      # (checksum-based manifest -- `touch` alone does not stale the module).
      - name: Force ggen_igniter app rebuild so the rustler NIF is always (re)built
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _build/dev/lib/ggen_igniter _build/test/lib/ggen_igniter

      # GI-08 follow-up (2026-09-02): the disclosed CI-07 gap above is
      # closed -- `mix format` was run for real across the whole tree
      # (confirmed beforehand that no `GENERATED by ...` marker file's
      # formatting would be touched: all 3 real generated-example files
      # under lib/ggen_igniter/*/examples/ already passed
      # `mix format --check-formatted` before this ran, so the wide run
      # left them untouched), and `mix format --check-formatted` now exits
      # 0 for real against this same tree. This is a real, unconditional
      # gate -- no `continue-on-error`.
      - name: mix format --check-formatted
        shell: bash
        run: |
          mix format --check-formatted

      # GI-08 follow-up (2026-09-02): the disclosed CI-07 gap above is
      # closed for real. Of the 34 findings CI-07 disclosed (32 refactor/
      # readability + 2 W), 4 were genuinely fixed this ticket
      # (Enum.map_join/3 in test/ggen_igniter_artifact_identity_properties_
      # test.exs, a real de-nesting split of lib/mix/tasks/
      # ggen_igniter.plan.ex's print_human/3, and a real arity reduction of
      # lib/ggen_igniter/pending_actuation.ex's for_inject/9 -> /8 --
      # verified against its one real call site in reconcile_reactor.ex).
      # The remaining 28 refactor findings (pre-existing complexity/nesting
      # inherent to real dispatch/orchestration logic across reconcile_
      # reactor.ex, sync.ex, doctor.ex, doctor_fixes.ex, schema_dispatch.ex,
      # and a couple of real property-test generators) and the 2 confirmed-
      # false-positive W findings on test/e2e/lifecycle_test.ex (that file's
      # `.ex` extension is a deliberate convention -- see .credo.exs's own
      # comment) are scoped, named, per-check+file `.credo.exs` exceptions,
      # each with its own one-line reason -- not silently disabled, not
      # left unaddressed. `mix credo` (default, non-strict) now exits 0 for
      # real against this same tree: "1261 mods/funs, found no issues." A
      # real, unconditional gate -- no `continue-on-error`.
      - name: mix credo
        shell: bash
        run: |
          mix credo

      # The one non-negotiable, must-actually-run job: the real, full
      # ExUnit suite, including the real subprocess-based `ggen sync run`
      # E2E tests (test/ggen_igniter_fortune5_ready_task_test.exs,
      # test/ggen_igniter_sync_shellout_test.exs) and the real
      # ggen.toml-round-trip idempotency regression tests
      # (test/ggen_igniter_bundle_test.exs "Test 2: idempotency", and
      # test/ggen_igniter_fortune5_ready_task_test.exs "...re-running is
      # idempotent", which runs `mix ggen_igniter.fortune5_ready` twice
      # against a real scratch fixture project and asserts the second run's
      # ggen.toml is byte-identical to the first).
      # Pre-compile the dev env before `mix test`. 78 tests across
      # test/*.exs spawn `System.cmd("mix", [task, ...])` without exporting
      # MIX_ENV, so those children run in MIX_ENV=dev. On a fresh checkout
      # (cache miss) the FIRST such child pays the full dev compile --
      # "Compiling 50 files (.ex)", the rustler `ggen_graph_nif` crate,
      # "Generated ggen_igniter app" -- and Mix prints that chatter on the
      # child's STDOUT, ahead of the task's own output. Which test eats it
      # is decided by the ExUnit seed, so it surfaces as a seed-dependent
      # flake: main run 33933744857 (seed 846163) failed
      # test/ggen_igniter_cli_tasks_quirks_test.exs:115 with
      # `Jason.DecodeError position: 0` because the JSON document was
      # preceded by compile output. Compiling dev once here, outside any
      # test, means no test subprocess ever sees compiler output -- fixing
      # the whole 78-site class without weakening the single-JSON-document
      # assertion (which is the real contract under test). Locally the same
      # flake reproduces with `rm -rf _build/dev && mix test <that file>`
      # and disappears with `mix compile` run first.
      - name: mix compile --warnings-as-errors (dev env)
        shell: bash
        run: |
          mix compile --warnings-as-errors

      - name: Semantic Jira Chicago boundary
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            lib/ggen_igniter/semantic_jira.ex
            lib/ggen_igniter/semantic_jira
            test/ggen_igniter_semantic_jira_event_sourcing_test.exs
            test/ggen_igniter_semantic_jira_pack_health_test.exs
            test/ggen_igniter_semantic_jira_pack_test.exs
            test/ggen_igniter_semantic_jira_shacl_test.exs
            test/ggen_igniter_semantic_jira_sole_canonical_test.exs
            test/ggen_igniter_semantic_jira_vocabulary_test.exs
          )
          if grep -RInE '\\b(Mox|defmock|expect\\(|stub\\()' "${paths[@]}"; then
            echo "REFUSED: semantic-jira court contains mock/stub machinery" >&2
            exit 1
          fi
          echo "semantic-jira Chicago boundary: real collaborators only"

      - name: mix test
        shell: bash
        run: |
          mix test
