name: ggen_igniter CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Stage 1 (ERRC 2026-09-28, docs/jira/v26.9.28/ci-runtime-errc.md): compile
  # ONCE (deps + release-mode ggen_graph_nif = the ~14 min cold cost) and run
  # the cheap gates; hand the compiled tree to the test shards through an
  # exact-SHA actions/cache entry so no shard pays the cold compile again.
  build:
    runs-on: ubuntu-latest
    # Budget (ERRC 2026-09-28): the documented cold pre-test cost is ~14 min
    # (deps + release-mode ggen_graph_nif; run 35895256423), plus format +
    # credo + verify + the extra MIX_ENV=test compile (~7 min, an estimate,
    # not yet measured on a hosted runner). ceil(1.5 x 21) = 32, rounded to 35.
    # The 90-minute single-job budget this replaces is retired: no job here
    # runs the whole suite any more.
    timeout-minutes: 35
    permissions:
      contents: read
    name: Build + format + credo + verify

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Semantic Jira's git-ground-truth court proves that the canonical
          # baseSha is an actual ancestor of this exact head. A depth-1
          # checkout makes every older honest SHA observationally absent and
          # turns the positive control into a false refusal. This repository's
          # own history is therefore a required test collaborator, just like
          # any other real collaborator.
          fetch-depth: 0

      - name: Set up Erlang/OTP + Elixir + rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          # Pinned to this repo's own .tool-versions (elixir 1.18.4-otp-27,
          # erlang 27.2.4) -- NOT beam4pm's pins, which are a different repo.
          elixir-version: '1.19.5'
          otp-version: '27.2.4'
          rebar3-version: '3.24.0'

      # Dependency downloads are reusable across source revisions. Compiled
      # application state is not: Rustler manufactures the native NIF during
      # Elixir compilation, so restoring _build under a mix.lock-only key can
      # restore a BEAM that expects priv/native/ggen_graph_nif.so without the
      # NIF artifact itself. Keep dependency and build identities separate.
      - name: Cache mix dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          restore-keys: "${{ runner.os }}-mix-deps-27.2.4-1.18.4-\n${{ runner.os }}-mix-deps-27.2.4-\n${{ runner.os }}-mix-deps-\n"
          key: ${{ runner.os }}-mix-deps-27.2.4-1.18.4-${{ hashFiles('mix.lock') }}
          path: "deps\n~/.hex\n~/.mix\n"

      # Exact build cache: no prefix restore. Any Elixir/NIF/mix input change
      # gets a fresh compilation, while an exact-subject retry can reuse its
      # own compiled tree.
      - name: Cache exact compiled build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ runner.os }}-mix-build-27.2.4-1.18.4-${{ hashFiles('mix.lock', 'mix.exs', 'lib/**/*.ex', 'native/**') }}
          path: _build

      # Cargo target dir for the NIF, keyed on its own lockfile so it rotates
      # whenever the crate's rust dependencies change.
      - name: Cache NIF cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ runner.os }}-nif-target-27.2.4-1.18.4-${{ hashFiles('native/ggen_graph_nif/Cargo.lock') }}
          path: native/ggen_graph_nif/target

      - name: mix deps.get
        shell: bash
        run: |
          mix deps.get

      # The `_build` cache is an immutable per-key actions/cache snapshot:
      # since the run that first saved the current `mix.lock`-keyed snapshot
      # (the only green run, 35021796291 on 2026-09-15 -- a cache MISS that
      # built everything for real), every later run restores that same
      # `_build`. Mix then marks `GgenIgniter.Native.GraphNif` (the rustler
      # loader module) up-to-date whenever neither `graph_nif.ex` nor its
      # `@external_resource` crate sources changed -- so rustler never runs,
      # `ggen_graph_nif` is never compiled, and
      # `_build/<env>/lib/ggen_igniter/priv/native/ggen_graph_nif.so` is
      # missing. Every NIF-backed test then fails with "function
      # GgenIgniter.Native.GraphNif.query_turtle/2 is undefined (module ...
      # is not available)": the 9 oxigraph/ASK-CONSTRUCT failures on every
      # run since 2026-09-18, pre-existing on main (35315548332), NOT
      # introduced by any branch's commits. Verified 2026-09-20: in the
      # failing runs, ggen_igniter DOES recompile its changed modules
      # ("Compiling 4 files (.ex)" + "Generated ggen_igniter app") with no
      # "Compiling crate ggen_graph_nif" line anywhere, and the repo's own
      # `ggen_igniter.doctor --json` reports `nif_compiles: ok` (real cargo
      # build) next to `oxigraph_smoke_test: error` (NIF absent) in the same
      # JSON document. Deleting ONLY this app's build artifacts (deps' beams
      # stay cached) forces a real ggen_igniter + NIF rebuild on every run --
      # the state a fresh checkout gets. The cargo target dir is cached (see
      # key above), so the forced rustler pass is incremental in steady
      # state. Locally reproduced and verified: with the app dirs wiped,
      # `mix compile` + `mix test test/*oxigraph*` rebuild the crate and go
      # 24/0 green; without the wipe, a deleted .so is never restored
      # (checksum-based manifest -- `touch` alone does not stale the module).
      - name: Force ggen_igniter app rebuild so the rustler NIF is always (re)built
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _build/dev/lib/ggen_igniter _build/test/lib/ggen_igniter

      # GI-08 follow-up (2026-09-02): the disclosed CI-07 gap above is
      # closed -- `mix format` was run for real across the whole tree
      # (confirmed beforehand that no `GENERATED by ...` marker file's
      # formatting would be touched: all 3 real generated-example files
      # under lib/ggen_igniter/*/examples/ already passed
      # `mix format --check-formatted` before this ran, so the wide run
      # left them untouched), and `mix format --check-formatted` now exits
      # 0 for real against this same tree. This is a real, unconditional
      # gate -- no `continue-on-error`.
      - name: mix format --check-formatted
        shell: bash
        run: |
          mix format --check-formatted

      # GI-08 follow-up (2026-09-02): the disclosed CI-07 gap above is
      # closed for real. Of the 34 findings CI-07 disclosed (32 refactor/
      # readability + 2 W), 4 were genuinely fixed this ticket
      # (Enum.map_join/3 in test/ggen_igniter_artifact_identity_properties_
      # test.exs, a real de-nesting split of lib/mix/tasks/
      # ggen_igniter.plan.ex's print_human/3, and a real arity reduction of
      # lib/ggen_igniter/pending_actuation.ex's for_inject/9 -> /8 --
      # verified against its one real call site in reconcile_reactor.ex).
      # The remaining 28 refactor findings (pre-existing complexity/nesting
      # inherent to real dispatch/orchestration logic across reconcile_
      # reactor.ex, sync.ex, doctor.ex, doctor_fixes.ex, schema_dispatch.ex,
      # and a couple of real property-test generators) and the 2 confirmed-
      # false-positive W findings on test/e2e/lifecycle_test.ex (that file's
      # `.ex` extension is a deliberate convention -- see .credo.exs's own
      # comment) are scoped, named, per-check+file `.credo.exs` exceptions,
      # each with its own one-line reason -- not silently disabled, not
      # left unaddressed. `mix credo` (default, non-strict) now exits 0 for
      # real against this same tree: "1261 mods/funs, found no issues." A
      # real, unconditional gate -- no `continue-on-error`.
      - name: mix credo
        shell: bash
        run: |
          mix credo

      # Compile BOTH envs here, once. `dev` because ~78 tests spawn
      # `System.cmd("mix", ...)` children in MIX_ENV=dev (a child paying the
      # first dev compile prints compiler chatter ahead of its JSON stdout;
      # main run 33933744857 flaked on it), `test` so every shard restores a
      # complete tree including priv/native/ggen_graph_nif.so.
      - name: mix compile (dev + test envs, so no shard or test subprocess pays a compile)
        shell: bash
        run: |
          mix compile
          MIX_ENV=test mix compile

      # gi-verify-task closure: `mix ggen_igniter.verify` (lib/mix/tasks/
      # ggen_igniter.verify.ex) had zero callers anywhere in this repo before
      # this step -- confirmed by `grep -rn "ggen_igniter.verify"
      # --exclude-dir=deps --exclude-dir=_build .` returning only the task's
      # own source and docs. Runs the task's real fail-CLOSED checks (the
      # inverted `verify/*.unbound.rq` companion queries plus the per-gate
      # cardinality contract) against the real, checked-in
      # `test/fixtures/ash_manufacture_pack` fixture on every PR, independent
      # of `test/mix/tasks/ggen_igniter_verify_task_test.exs`'s own coverage
      # below -- so a regression that broke the task itself (not just its
      # test) still fails CI even if the test file were ever skipped or
      # reverted. That fixture is kept lawful by
      # `test/ggen_igniter_gate_verify_test.exs` and this step, so `--json`
      # here must exit 0; a nonzero exit fails the job.
      - name: mix ggen_igniter.verify (fail-CLOSED pack check)
        shell: bash
        run: |
          mix ggen_igniter.verify --pack test/fixtures/ash_manufacture_pack --json

      # Seed the shards: exact-SHA key, saved only when this job succeeds.
      - name: Save compiled tree for the test shards
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ runner.os }}-ci-build-${{ github.sha }}
          path: |
            _build
            deps
            ~/.hex
            ~/.mix
            native/ggen_graph_nif/target

  # Stage 2: the FULL suite (GGEN_TEST_FULL=1 = fast lane + every
  # :integration test; test/test_helper.exs excludes :integration by default,
  # and an `--include integration` would override `--exclude heavy`)
  # split across 6 ExUnit partitions, each on its own runner (each
  # partition's `mix` children share that runner's _build, never another's).
  # Union of shards == the old single `mix test` (conservation proof in the
  # ERRC doc). fail-fast: false so one red shard never hides another's result.
  test:
    needs: build
    runs-on: ubuntu-latest
    # Budget: the slowest of the 6 partitions took 329 s on a 16-core dev
    # machine (others 55-231 s; local measurement, not a hosted runner). A
    # 2-vCPU runner is assumed <= 2x slower => ~11 min + ~3 min cache restore
    # and setup = 14; ceil(1.5 x 14) = 21, rounded to 25. Extrapolation, to
    # be replaced by the first hosted run's numbers.
    timeout-minutes: 25
    permissions:
      contents: read
    name: mix test (partition ${{ matrix.partition }}/6)
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6]
    env:
      MIX_TEST_PARTITION: ${{ matrix.partition }}
      # Real Postgres for `:postgres` Chicago tests (GgenIgniter.Test.PostgresCase.available?/0
      # reads these; when unreachable test_helper.exs excludes the tag instead of failing).
      QUALIFY_PGHOST: localhost
      QUALIFY_PGPORT: "5432"
      QUALIFY_PGUSER: postgres
      QUALIFY_PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Semantic Jira's git-ground-truth court proves that the canonical
          # baseSha is an actual ancestor of this exact head. A depth-1
          # checkout makes every older honest SHA observationally absent and
          # turns the positive control into a false refusal. This repository's
          # own history is therefore a required test collaborator, just like
          # any other real collaborator.
          fetch-depth: 0

      # Real ggen binary on PATH: several real, non-mocked ExUnit tests
      # (test/ggen_igniter_fortune5_ready_task_test.exs,
      # test/ggen_igniter_sync_shellout_test.exs) shell out to the real
      # `ggen` CLI and are gated behind `if System.find_executable("ggen")`
      # -- a named, visible skip when absent, per this repo's Chicago-style
      # testing discipline (real collaborator over a mock). Installing the
      # same pinned release this repo's own docs cite
      # (docs/jira/v26.9.1/PARITY-VALIDATION.md: "ggen --version -> ggen
      # 26.8.28") makes those tests actually run in CI instead of skip.
      # Checksum independently reverified against this exact release asset
      # during CI-07 authoring, not copied blind from beam4pm's workflow.
      - name: Install ggen (pinned release, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          archive="$RUNNER_TEMP/ggen-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --tlsv1.2 \
            -o "$archive" \
            https://github.com/seanchatmangpt/ggen/releases/download/v26.8.28/ggen-x86_64-unknown-linux-gnu.tar.gz
          echo 'ccb9fe78ef0c84d8b240b45beb6e73f47e2c930d5db3efcf9a0e58dfe071d313  '"$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.local/bin" ggen
          chmod +x "$HOME/.local/bin/ggen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Erlang/OTP + Elixir + rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          # Pinned to this repo's own .tool-versions (elixir 1.18.4-otp-27,
          # erlang 27.2.4) -- NOT beam4pm's pins, which are a different repo.
          elixir-version: '1.19.5'
          otp-version: '27.2.4'
          rebar3-version: '3.24.0'

      - name: Restore compiled tree from the build job
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ runner.os }}-ci-build-${{ github.sha }}
          fail-on-cache-miss: true
          path: |
            _build
            deps
            ~/.hex
            ~/.mix
            native/ggen_graph_nif/target

      - name: mix test (partition ${{ matrix.partition }} of 6, full suite minus :heavy)
        shell: bash
        run: |
          # Cache-restore hardening (2026-09-15): a restored _build/test can
          # carry current beams WITHOUT the rustler ggen_graph_nif.so. The
          # build job compiles both envs, but keep the guard: force a full
          # test-env recompile only when the artifact is missing.
          if [ ! -f _build/test/lib/ggen_igniter/priv/native/ggen_graph_nif.so ]; then
            MIX_ENV=test mix compile --force
          fi
          GGEN_TEST_FULL=1 mix test --exclude heavy --partitions 6


  # Stage 2b: the single file that is ~59% of the serial suite's test time
  # (test/ggen_igniter_semantic_jira_pack_test.exs, tagged :heavy; 8 of its 67
  # tests take 85-250 s each). Tests inside one module run serially, so no
  # partition count can split it -- but ExUnit's `describe` tag can. Five
  # groups run on five runners concurrently with the shards (which run
  # `--exclude heavy`). Group 5 is the COMPLEMENT (`--exclude` of every
  # describe named in groups 1-4), so a renamed or newly added describe
  # falls into group 5 and still runs: the union of the five groups is the
  # whole file whatever the describe names become.
  test-heavy:
    needs: build
    runs-on: ubuntu-latest
    # Budget: slowest describe group 185 s (dev machine;
    # groups 72-185 s, complement group 3 s). Same <= 2x runner factor
    # + ~3 min setup => ~9 min; ceil(1.5 x 9) = 14, rounded to 20 because the
    # per-test times inside this file swung 2-3x with machine load (a serial
    # run under load took 1566 s vs 967 s idle). Extrapolation.
    timeout-minutes: 20
    permissions:
      contents: read
    name: mix test (heavy group ${{ matrix.group }}/5 - semantic_jira_pack_test)
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Semantic Jira's git-ground-truth court proves that the canonical
          # baseSha is an actual ancestor of this exact head. A depth-1
          # checkout makes every older honest SHA observationally absent and
          # turns the positive control into a false refusal. This repository's
          # own history is therefore a required test collaborator, just like
          # any other real collaborator.
          fetch-depth: 0

      # Real ggen binary on PATH: several real, non-mocked ExUnit tests
      # (test/ggen_igniter_fortune5_ready_task_test.exs,
      # test/ggen_igniter_sync_shellout_test.exs) shell out to the real
      # `ggen` CLI and are gated behind `if System.find_executable("ggen")`
      # -- a named, visible skip when absent, per this repo's Chicago-style
      # testing discipline (real collaborator over a mock). Installing the
      # same pinned release this repo's own docs cite
      # (docs/jira/v26.9.1/PARITY-VALIDATION.md: "ggen --version -> ggen
      # 26.8.28") makes those tests actually run in CI instead of skip.
      # Checksum independently reverified against this exact release asset
      # during CI-07 authoring, not copied blind from beam4pm's workflow.
      - name: Install ggen (pinned release, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          archive="$RUNNER_TEMP/ggen-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --tlsv1.2 \
            -o "$archive" \
            https://github.com/seanchatmangpt/ggen/releases/download/v26.8.28/ggen-x86_64-unknown-linux-gnu.tar.gz
          echo 'ccb9fe78ef0c84d8b240b45beb6e73f47e2c930d5db3efcf9a0e58dfe071d313  '"$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$HOME/.local/bin" ggen
          chmod +x "$HOME/.local/bin/ggen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Erlang/OTP + Elixir + rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          # Pinned to this repo's own .tool-versions (elixir 1.18.4-otp-27,
          # erlang 27.2.4) -- NOT beam4pm's pins, which are a different repo.
          elixir-version: '1.19.5'
          otp-version: '27.2.4'
          rebar3-version: '3.24.0'

      - name: Restore compiled tree from the build job
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ runner.os }}-ci-build-${{ github.sha }}
          fail-on-cache-miss: true
          path: |
            _build
            deps
            ~/.hex
            ~/.mix
            native/ggen_graph_nif/target

      - name: mix test (heavy file, describe group ${{ matrix.group }})
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          if [ ! -f _build/test/lib/ggen_igniter/priv/native/ggen_graph_nif.so ]; then
            MIX_ENV=test mix compile --force
          fi
          D_ADM='describe:admission boundary falsifier matrix'
          D_PRD='describe:PRD projection template'
          D_OCEL='describe:OCEL event-log projection'
          D_SHACL='describe:SHACL court wiring on the pack admission path'
          D_GB='describe:graph-binding tripwires'
          D_WBPR='describe:WBPR projection template'
          D_ARD='describe:ARD projection template'
          D_GIT='describe:opt-in git ground truth for baseSha (residual_base_sha_wrong_commit closure)'
          D_WO='describe:canonical WorkOrder graph -> deterministic Markdown projection -> graph-bound receipt'
          D_HDDL='describe:HDDL planning projection template'
          D_VIS='describe:Vision projection template (V23-T6R: the adopted WO-03 template, executed)'
          case "$GROUP" in
            1) args=(--only "$D_ADM" --only "$D_OCEL" --only "$D_SHACL" --only "$D_GB") ;;
            2) args=(--only "$D_WBPR" --only "$D_ARD" --only "$D_PRD") ;;
            3) args=(--only "$D_GIT" --only "$D_WO") ;;
            4) args=(--only "$D_HDDL" --only "$D_VIS") ;;
            5) args=(--exclude "$D_ADM" --exclude "$D_PRD" --exclude "$D_OCEL" --exclude "$D_SHACL" --exclude "$D_GB" \
                     --exclude "$D_WBPR" --exclude "$D_ARD" --exclude "$D_GIT" --exclude "$D_WO" \
                     --exclude "$D_HDDL" --exclude "$D_VIS") ;;
          esac
          GGEN_TEST_FULL=1 mix test test/ggen_igniter_semantic_jira_pack_test.exs "${args[@]}"
