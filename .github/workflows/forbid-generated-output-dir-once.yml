name: one-shot forbid generated output directory

on:
  push:
    branches:
      - fix/forbid-generated-output-dir

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.18.4
          otp-version: 27.2.4

      - name: Patch runtime policy, docs, and Chicago contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          actuate_path = Path("lib/ggen_igniter/actuate.ex")
          actuate = actuate_path.read_text()

          doc_anchor = "  Igniter AST-patch actuation (a real `Sourceror`/`Igniter.Code`-based\n"
          policy_doc = '''  ## Reserved `generated/` directory invariant\n\n  A directory path segment named exactly `generated` is a forbidden output\n  ownership surface. Generated projections must land at their canonical source\n  location (for example `lib/my_app/accounts/user.ex`), not under a parallel\n  `generated/` tree. This is fail-closed across all three filesystem actuation\n  paths below, including `--dry-run`: the path is canonicalized first so `.`/`..`\n  aliases and existing symlink aliases cannot bypass the refusal. A filename such\n  as `generated_file.ex` is valid; only a directory segment named `generated` is\n  reserved.\n\n'''
          if policy_doc not in actuate:
              if doc_anchor not in actuate:
                  raise SystemExit("actuate moduledoc anchor not found")
              actuate = actuate.replace(doc_anchor, policy_doc + doc_anchor, 1)

          replacements = [
              (
                  "  def write_new_file!(path, content) do\n    File.mkdir_p!(Path.dirname(path))",
                  "  def write_new_file!(path, content) do\n    refuse_generated_directory!(path)\n    File.mkdir_p!(Path.dirname(path))",
              ),
              (
                  "  def write_file!(path, content, opts \\\\ []) do\n    unless_exists = Keyword.get(opts, :unless_exists, false)",
                  "  def write_file!(path, content, opts \\\\ []) do\n    refuse_generated_directory!(path)\n    unless_exists = Keyword.get(opts, :unless_exists, false)",
              ),
              (
                  "  def inject_content!(path, marker, content, insert_mode, opts \\\\ [])\n      when insert_mode in [:before, :after, :at_line] do\n    dry_run = Keyword.get(opts, :dry_run, false)",
                  "  def inject_content!(path, marker, content, insert_mode, opts \\\\ [])\n      when insert_mode in [:before, :after, :at_line] do\n    refuse_generated_directory!(path)\n    dry_run = Keyword.get(opts, :dry_run, false)",
              ),
          ]
          for old, new in replacements:
              if new in actuate:
                  continue
              if old not in actuate:
                  raise SystemExit(f"actuate function anchor not found: {old.splitlines()[0]}")
              actuate = actuate.replace(old, new, 1)

          helper_anchor = "  defp matches?(content, %Regex{} = pattern), do: Regex.match?(pattern, content)\n"
          helper = '''  # Fail-closed output policy shared by every filesystem actuation path.\n  # Canonicalization resolves lexical aliases and existing symlink aliases before\n  # checking the project-relative path for the reserved directory segment.\n  defp refuse_generated_directory!(path) do\n    cwd = File.cwd!()\n    canonical_root = GgenIgniter.ArtifactIdentity.canonicalize(cwd, ".")\n    canonical_target = GgenIgniter.ArtifactIdentity.canonicalize(cwd, path)\n    relative_target = Path.relative_to(canonical_target, canonical_root)\n\n    if Enum.member?(Path.split(relative_target), "generated") do\n      raise ArgumentError,\n            "REFUSED generated_directory: output path #{inspect(path)} resolves through " <>\n              "a reserved `generated/` directory (#{inspect(canonical_target)}). " <>\n              "Write the projection to its canonical source location instead."\n    end\n\n    :ok\n  end\n\n'''
          if helper not in actuate:
              if helper_anchor not in actuate:
                  raise SystemExit("actuate helper anchor not found")
              actuate = actuate.replace(helper_anchor, helper + helper_anchor, 1)

          actuate_path.write_text(actuate)

          # Remove sanctioned examples of the antipattern from the two public surfaces
          # that currently teach it. Keep `generated_file.ex` valid: the invariant is a
          # directory segment, not a substring ban.
          for path_str in ["README.md", "lib/mix/tasks/ggen_igniter.sync.ex"]:
              path = Path(path_str)
              text = path.read_text()
              text = text.replace('lib/generated/<%= module_name %>.ex', 'lib/<%= Macro.underscore(module_name) %>.ex')
              text = text.replace('lib/generated/Multi.Alpha.ex', 'lib/multi/alpha.ex')
              text = text.replace('lib/generated/Multi.Beta.ex', 'lib/multi/beta.ex')
              text = text.replace('lib/generated/Multi.Gamma.ex', 'lib/multi/gamma.ex')
              text = text.replace('lib/generated/resource.ex', 'lib/my_app/resources/resource.ex')
              text = text.replace('lib/generated.ex', 'lib/my_app/extension.ex')
              path.write_text(text)

          test_path = Path("test/generated_directory_policy_test.exs")
          test_path.write_text(r'''defmodule GgenIgniter.GeneratedDirectoryPolicyTest do
  @moduledoc """
  Chicago-style: real temporary directories, real files, a real filesystem
  symlink, and the real `GgenIgniter.Actuate` write/injection functions prove
  that a canonical directory segment named `generated` is refused before any
  mutation while similarly named files remain writable.
  """

  use ExUnit.Case, async: true

  alias GgenIgniter.Actuate

  setup do
    root =
      Path.join(
        System.tmp_dir!(),
        "ggen_igniter_generated_dir_policy_#{System.unique_integer([:positive])}"
      )

    File.rm_rf!(root)
    File.mkdir_p!(root)
    on_exit(fn -> File.rm_rf!(root) end)
    {:ok, root: root}
  end

  describe "filesystem actuation generated/ refusal" do
    test "write_new_file!/2 refuses a generated directory before creating anything", %{root: root} do
      path = Path.join([root, "lib", "generated", "widget.ex"])

      assert_raise ArgumentError, ~r/REFUSED generated_directory/, fn ->
        Actuate.write_new_file!(path, "defmodule Widget, do: :ok\n")
      end

      refute File.exists?(path)
      refute File.exists?(Path.dirname(path))
    end

    test "write_file!/3 refuses generated directories even under dry-run", %{root: root} do
      path = Path.join([root, "lib", "generated", "widget.ex"])

      assert_raise ArgumentError, ~r/REFUSED generated_directory/, fn ->
        Actuate.write_file!(path, "defmodule Widget, do: :ok\n", dry_run: true)
      end

      refute File.exists?(path)
    end

    test "inject_content!/5 refuses an existing target under generated before mutation", %{root: root} do
      path = Path.join([root, "lib", "generated", "host.ex"])
      File.mkdir_p!(Path.dirname(path))
      original = "defmodule Host do\n  # ggen:slot\nend\n"
      File.write!(path, original)

      assert_raise ArgumentError, ~r/REFUSED generated_directory/, fn ->
        Actuate.inject_content!(path, "# ggen:slot", "  def projected, do: :ok", :after)
      end

      assert File.read!(path) == original
    end

    test "canonicalization prevents a real symlink alias from bypassing the refusal", %{root: root} do
      generated_dir = Path.join(root, "generated")
      alias_dir = Path.join(root, "projection_alias")
      File.mkdir_p!(generated_dir)
      File.ln_s!(generated_dir, alias_dir)
      path = Path.join(alias_dir, "widget.ex")

      assert_raise ArgumentError, ~r/REFUSED generated_directory/, fn ->
        Actuate.write_file!(path, "defmodule Widget, do: :ok\n")
      end

      refute File.exists?(Path.join(generated_dir, "widget.ex"))
    end

    test "a filename containing generated remains valid", %{root: root} do
      path = Path.join([root, "lib", "generated_file.ex"])

      assert {:ok, :written} =
               Actuate.write_file!(path, "defmodule GeneratedFile, do: :ok\n")

      assert File.read!(path) == "defmodule GeneratedFile, do: :ok\n"
    end
  end
end
''')
          PY

      - name: Show bounded diff before execution
        run: |
          git diff --stat
          git diff -- lib/ggen_igniter/actuate.ex test/generated_directory_policy_test.exs README.md lib/mix/tasks/ggen_igniter.sync.ex
          git diff --check

      - name: Install dependencies
        run: mix deps.get

      - name: Format changed Elixir files
        run: mix format lib/ggen_igniter/actuate.ex lib/mix/tasks/ggen_igniter.sync.ex test/generated_directory_policy_test.exs

      - name: Compile warnings-as-errors
        run: mix compile --warnings-as-errors

      - name: Chicago contract test
        run: mix test test/generated_directory_policy_test.exs

      - name: Full suite
        run: mix test

      - name: Anti-mock gate
        run: |
          if grep -rn "Mock\|mock(\|patch(\|monkeypatch" test lib native | grep -v "prose-disclaimer"; then
            echo "anti-mock grep produced matches; inspect above" >&2
            exit 1
          fi

      - name: Ensure docs no longer sanction generated directories
        run: |
          if grep -RIn --exclude-dir=.git --exclude='*.lock' 'lib/generated/' README.md lib docs priv test; then
            echo "lib/generated/ remains on a sanctioned surface" >&2
            exit 1
          fi

      - name: Commit verified change and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/forbid-generated-output-dir-once.yml
          git add README.md lib/ggen_igniter/actuate.ex lib/mix/tasks/ggen_igniter.sync.ex test/generated_directory_policy_test.exs .github/workflows/forbid-generated-output-dir-once.yml
          git diff --cached --check
          git config user.name "ggen-igniter verifier"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: forbid generated output directories"
          git push origin HEAD:fix/forbid-generated-output-dir
