name: Frontier Release Plan

on:
  pull_request:
    paths:
      - "lib/ggen_igniter/frontier_release_plan.ex"
      - "test/frontier_release_plan_test.exs"
      - ".github/workflows/frontier-release-plan.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontier-release-plan:
    name: Frontier response-plan semantic gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Erlang/OTP + Elixir + rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.2.4"
          rebar3-version: "3.24.0"

      - name: Cache mix dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          restore-keys: |
            ${{ runner.os }}-frontier-mix-27.2.4-1.18.4-
            ${{ runner.os }}-frontier-mix-27.2.4-
          key: ${{ runner.os }}-frontier-mix-27.2.4-1.18.4-${{ hashFiles('mix.lock') }}
          path: |
            deps
            ~/.hex
            ~/.mix
            _build

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check Frontier files are formatted
        run: >-
          mix format --check-formatted
          lib/ggen_igniter/frontier_release_plan.ex
          test/frontier_release_plan_test.exs

      - name: Compile exact subject
        run: mix compile --warnings-as-errors

      - name: Run Frontier semantic tests
        run: mix test test/frontier_release_plan_test.exs --trace
